# Пример server-блока для статической версии тротуарка59.рф (замена Next.js).
# Адреса страниц остаются прежними: /catalog, /catalog/kaliforniya, /gallery, ...
# Файлы лежат как catalog.html, catalog/kaliforniya.html — try_files отдаёт их без .html.

server {
    listen 80;
    listen [::]:80;
    server_name xn--59-6kca3cwancocl.xn--p1ai www.xn--59-6kca3cwancocl.xn--p1ai;
    return 301 https://xn--59-6kca3cwancocl.xn--p1ai$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.xn--59-6kca3cwancocl.xn--p1ai;
    # ssl_certificate ...; ssl_certificate_key ...;
    return 301 https://xn--59-6kca3cwancocl.xn--p1ai$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xn--59-6kca3cwancocl.xn--p1ai;
    # ssl_certificate ...; ssl_certificate_key ...;   (оставить текущие из старого конфига)

    root /var/www/trotuarka59/dist;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Адреса без .html; /index.html и *.html — 301 на чистый адрес (без дублей)
    location = /index.html { return 301 /; }
    location ~ ^/(.+)\.html$ { return 301 /$1; }
    # Хвостовой слэш — 301 на адрес без него (как было на Next.js)
    rewrite ^/(.+)/$ /$1 permanent;

    # Главная — отдельно: $uri/ + index дали бы петлю с редиректом /index.html -> /
    location = / { try_files /index.html =404; }

    location / {
        try_files $uri $uri.html =404;
    }

    # Старые адреса картинок Next.js-версии -> раздел каталога (вес в Яндекс.Картинках)
    location ^~ /upload/ { return 301 /catalog; }
    location ^~ /_next/ { return 410; }
    location ^~ /api/ { return 410; }   # если обработчик заявок будет на этом домене — исключить его путь

    location ~* \.(webp|jpg|png|svg|ico|woff2)$ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }
    location ~* \.(css|js)$ { expires 7d; try_files $uri =404; }

    error_page 404 /404.html;
    location = /404.html { internal; }   # точное совпадение важнее regex-правила с 301 выше
}
